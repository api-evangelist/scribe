name: Scribe
description: >-
  Scribe (scribehow) is an AI workflow-documentation platform founded in 2019 that
  automatically turns any process or software walkthrough into a step-by-step guide.
  Its products — Scribe Capture, the knowledge base, and the newer Scribe Optimize
  workflow-mapping platform — are used by more than five million people across a large
  share of the Fortune 500. For developers, Scribe publishes a read-only Search &
  Retrieval API (OpenAPI 3.1) that searches, lists, and retrieves an organization's
  Scribe Documents and Knowledge Pages for integration into custom applications and AI
  agents. Public API access is an Enterprise-plan feature authenticated with a static
  API key sent in the X-API-Key header. The company is backed by Amplify Partners,
  Redpoint Ventures, Tiger Global, StepStone, Morado Ventures, and New York Life Ventures,
  and reached a $1.3B valuation with its 2025 Series C.
